name: Codex app-server qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published Codex version (for example 0.157.0)
        required: true
        type: string
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select public release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
          else
            tag="$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/openai/codex/releases/latest | jq -er '.tag_name')"
            version="${tag#rust-v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]
          printf 'CODEX_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Qualify isolated app-server
        env:
          GH_TOKEN: ${{ github.token }}
          MEKTUP_COMPAT_REPORT_DIR: ${{ runner.temp }}/mektup-codex-qualification
        run: scripts/qualify-codex-release.sh "$CODEX_VERSION"
      - name: Keep qualification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/mektup-codex-qualification/
          if-no-files-found: warn
          retention-days: 30
