name: Publish qualified Codex compatibility
run-name: Publish qualification ${{ inputs.qualification_run_id || github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [Codex app-server qualification]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Successful main qualification run to consume or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: automated-codex-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'agensfield/mektup' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Configure repository-local automation identity and GitHub authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
      - name: Consume qualification and publish through the existing gates
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id || github.event.workflow_run.id }}
        run: python3 scripts/auto_codex_release.py --qualification-run "$QUALIFICATION_RUN_ID"
