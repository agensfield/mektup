name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# The release job is the only job allowed to create GitHub release metadata.
permissions:
  contents: read

jobs:
  release:
    name: Package and publish release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Prefetch pinned Go modules
        working-directory: go
        run: go mod download
      - name: Verify the repository and Go module tags agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}")" = "$(git rev-parse "refs/tags/go/${RELEASE_TAG}")"
      - name: Validate contracts
        run: ./scripts/validate-contract-json.sh
      - name: Install Syft for the GoReleaser SBOM step
        uses: anchore/sbom-action/download-syft@v0.20.5
        with:
          syft-version: v1.51.1
      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
